# glossary.yml — plain-English definitions for terms used in market_analysis_*.md
#
# Spec: report_content_direction_spec.md#CD.4
#
# Editorial content. Reword any definition freely — no Python change needed.
#
# How this is used
# ----------------
# generate_insight_report.py renders "## A. Glossary" at the end of the report,
# containing ONLY the terms that actually appear in that run's report body. A term
# never used in the report is never defined.
#
# A standing test (CD.5) fails the build if a term listed here under `guard: true`
# appears in the report body with no definition — that is the protection against
# new undefined jargon creeping back into the report.
#
# Fields per entry
# ----------------
#   term        the heading shown in the glossary (required)
#   aliases     other spellings that count as "this term appears in the report".
#               Matched case-insensitively on whole words. Defaults to [term].
#   definition  plain English, no jargon-inside-the-jargon (required)
#   guard       true = CD.5 fails if this appears undefined. Default true.

# Column-name definitions for the .xlsx workbook (CD.9).
#
# The workbook's headers are machine field names — `avg_serp_da`, `Params_Hash`,
# `Rank_Delta`. They are NOT renamed: the JSON and the workbook share one field
# vocabulary that validate_xlsx_vs_json.py checks, and renaming headers would
# break that contract and any formulas built on them. Instead serp_audit.py
# writes a "Glossary" sheet from this list, so the meaning travels with the file.
#
# Each entry: `column` (the header exactly as written), `sheet` (where it appears,
# free text), `definition` (plain English).
# Workbook sheet guidance (CD.9) — why a given sheet may be empty.
#
# Moved out of serp_audit.py's build_help_rows(), which held this reader-facing
# text as a Python literal. It is editorial content: a non-developer may well
# want to reword it, and none of it is logic. Written to the workbook's "Help"
# sheet.
#
# Each entry: Tab, Trigger, Likely_Query_Type, Why_Empty.
sheet_guidance:
- Tab: AI_Overview_Citations
  Trigger: Google returns AI Overview with references/citations.
  Likely_Query_Type: Informational queries like 'how to choose a counsellor' or 'how much
    does counselling cost'.
  Why_Empty: Local/commercial intent (e.g., 'best', 'near me', 'in [city]') often shows maps/ads/organic
    instead of AI Overview.
- Tab: Rich_Features
  Trigger: SERP contains modules like videos, top stories, image pack, shopping, or knowledge
    graph.
  Likely_Query_Type: News/video/image/product/entity intent queries.
  Why_Empty: Local service intent often returns map pack + PAA without these modules.
- Tab: Autocomplete_Suggestions
  Trigger: Autocomplete endpoint returns suggestion strings.
  Likely_Query_Type: Shorter seed phrases like 'stress counselling' or 'help with stress'.
  Why_Empty: Long-tail full phrases can return no autocomplete suggestions.
- Tab: AI_Query_Generator (GUI Option)
  Trigger: Enable 'Run 2 AI-likely alternatives (A.1, A.2)' in the launcher.
  Likely_Query_Type: Local seed query A plus two informational alternatives A.1/A.2.
  Why_Empty: If disabled, only base query A runs; fewer chances to trigger AI Overview.

columns:
  - column: Run_ID
    sheet: all
    definition: >-
      Timestamp identifying one run of the tool. Every row from the same run
      carries the same value, so you can separate runs when sheets are combined.
  - column: Root_Keyword / Source_Keyword
    sheet: most
    definition: >-
      The keyword from your CSV that this row came from. Source_Keyword is the
      specific search executed; Root_Keyword is the original seed it derived from.
  - column: Query_Label
    sheet: Overview, Keyword_Feasibility
    definition: >-
      Which variant of the search this row is. "A" is the keyword as you supplied
      it; "P" is a hyper-local pivot variant the tool generated. Pivot rows are
      suggestions, not measurements of your keyword.
  - column: Executed_Query
    sheet: most
    definition: >-
      The exact text sent to Google, after any location or variant handling. Check
      this when results look unrelated to the keyword you entered.
  - column: Params_Hash
    sheet: most
    definition: >-
      A fingerprint of the search parameters used. Two rows with the same hash were
      fetched under identical conditions and are directly comparable.
  - column: SERP_Features
    sheet: Overview
    definition: >-
      Which boxes Google showed besides the plain links (map pack, video row, answer
      box). "Standard Organic" is not a feature — it means none were found.
  - column: Rank
    sheet: Organic_Results
    definition: >-
      Position in the unpaid results. 1 is the top link.
  - column: Rank_Delta
    sheet: Organic_Results
    definition: >-
      How many positions this URL moved since the previous run of the same keyword.
      Positive is an improvement. Blank means no comparable earlier run.
  - column: Is_Destination_Page
    sheet: Organic_Results
    definition: >-
      Whether the Link is the page that actually ranked. Google now hides result
      URLs behind a redirect, and the tool can usually recover only the site,
      not the page. FALSE means anything page-level for that row — Word_Count,
      Content_Type, Page Authority — reads "Not Measured" rather than being
      taken from the wrong page. Read it with Link_Status, which says whether
      the site was recovered or nothing was.
  - column: Link_Status
    sheet: Organic_Results
    definition: >-
      Where this row's Link came from. "destination" is the page that ranked,
      as Google sent it. "site_root" means Google hid the URL and only the site
      could be recovered: the competitor is known, the page is not.
      "unrecovered" means not even the site could be recovered, so the row has
      no URL and counts towards nothing — not a competitor with no authority,
      a result that was never measured.
  - column: Client_Cited
    sheet: Situational_Probes
    definition: >-
      Whether your site was among the sources the AI Overview cited for this
      probe question. FALSE on its own means you were not cited. FALSE beside a
      non-zero Citations_Unresolved means the question was not settled: some of
      the citations could not be traced to a site, and one of them may have been
      yours.
  - column: Citations_Unresolved
    sheet: Situational_Probes
    definition: >-
      How many of this probe's AI Overview citations Google hid behind a redirect
      that could not be traced back to a site. Those citations were counted but
      not identified, so they can neither confirm nor rule out a mention of you.
      Zero means every citation was identified and Client_Cited is a measurement.
  - column: Entity_Type
    sheet: Organic_Results
    definition: >-
      What kind of organisation owns the page — counselling practice, directory,
      government, nonprofit, publisher. "N/A" means the classifier could not tell,
      not that the page has no owner.
  - column: Content_Type
    sheet: Organic_Results
    definition: >-
      What kind of page it is — guide, news, service page. "other" is the
      classifier's unknown bucket, not a format you can write.
  - column: FAQ_Present / Schema_Types
    sheet: Organic_Results
    definition: >-
      Whether the page carries machine-readable question-and-answer labelling, and
      which schema.org types it declares. Pages with FAQ markup are easier for AI
      answer engines to quote.
  - column: Question_Heading_Count / Question_Headings
    sheet: Organic_Results
    definition: >-
      How many of the page's headings are phrased as questions, and what they are.
      A high count on competitors is a sign the topic rewards answer-first format.
  - column: Credential_Hits / Author_Present / Review_Marker_Present
    sheet: Organic_Results
    definition: >-
      Trust signals found on the page — professional credentials named, a bylined
      author, visible reviews. These are the E-E-A-T markers Google associates with
      expertise.
  - column: Intro_Text_Length
    sheet: Organic_Results
    definition: >-
      Characters of prose before the page's first substantive heading. A large
      number means the answer is buried, which makes the page hard to quote.
  - column: client_da
    sheet: Keyword_Feasibility
    definition: >-
      Your site's Domain Authority — a 0-100 third-party estimate of ranking
      strength, based largely on who links to you.
  - column: avg_serp_da
    sheet: Keyword_Feasibility
    definition: >-
      The average Domain Authority of the sites currently ranking for this keyword.
      This is what you are being compared against. It averages only the ranking
      domains that had a Domain Authority record — read da_count beside it, since
      an average of three domains and an average of ten look identical here.
  - column: da_count / da_missing
    sheet: Keyword_Feasibility
    definition: >-
      How many of the ranking domains had a Domain Authority record (da_count) and
      how many did not (da_missing). Together they are the window avg_serp_da was
      taken over. A domain with no record is left out of the average, never counted
      as a Domain Authority of zero — counting absences as zeros pulled the average
      down and made hard keywords look winnable.
  - column: da_provider
    sheet: Keyword_Feasibility
    definition: >-
      Which service supplied the Domain Authority figures on this row — dataforseo
      or moz. Their scores are not interchangeable, so never compare a figure from
      one against a figure from the other, or track a trend across both.
  - column: client_da_source
    sheet: Keyword_Feasibility
    definition: >-
      Where your own Domain Authority on this row came from: the provider plus the
      date it was measured, "operator override" if you passed one on the command
      line, or "config fallback (unmeasured, ...)" when the provider had no record
      and the value in config.yml stood in. A config value is not a measurement and
      may be on a different vendor's scale, so a gap built on one is indicative.
  - column: gap
    sheet: Keyword_Feasibility
    definition: >-
      avg_serp_da minus client_da. Negative means you are the stronger site and
      ranking is realistic. Positive means they are stronger. Within about two
      points, treat it as level — the underlying score is an estimate.
  - column: feasibility_score / feasibility_status
    sheet: Keyword_Feasibility
    definition: >-
      The gap turned into a normalised score and a High / Moderate / Low verdict.
      "Not Measured" means there was not enough measured Domain Authority to give a
      verdict — fewer than five ranking domains had a record, or your own Domain
      Authority was never measured. That is different from a low score, and the row
      still shows whatever numbers were measured.
  - column: pivot_status / suggested_keyword / all_variants
    sheet: Keyword_Feasibility
    definition: >-
      Whether the tool suggests targeting a narrower neighbourhood-level keyword
      instead, which one, and every variant it considered. Only generated for
      service-type keywords.
  - column: Client_In_Local_Pack
    sheet: Keyword_Feasibility
    definition: >-
      Whether your business appeared in the map box. Blank means the check could not
      be run — not that you were absent.
  - column: Type / Phrase / Count
    sheet: SERP_Language_Patterns
    definition: >-
      Repeated two- and three-word phrases from the SERP text, with how often each
      appeared. Stop words are stripped before counting here, so phrases read oddly
      ("family origin"). The readable version is in the Markdown report, Section 3.
  - column: Has_Main_AI_Overview / Has_PAA_AI_Overview
    sheet: Overview
    definition: >-
      Whether Google showed an AI-written summary at the top of the page, and
      whether one appeared inside the People Also Ask box.
  - column: AI_Sentiment / AI_Subjectivity / AI_Reading_Level
    sheet: Overview
    definition: >-
      Automated readings of the AI Overview's tone, opinion level and reading
      difficulty. Indicative only — useful for comparing runs, not as absolute
      measures.

terms:
  - term: SERP
    aliases: [SERP, SERPs]
    definition: >-
      Search Engine Results Page — the Google page you get after searching. Everything
      on it, not just the list of links.

  - term: SERP feature
    aliases: ["SERP feature", "SERP features", "search page feature", "search page features"]
    definition: >-
      Any box Google puts on the results page besides the plain list of blue links —
      a map, a video row, an answer box, an image strip. Features push the ordinary
      results further down the page.

  - term: Local Map Pack
    aliases: ["Local Map Pack", "map pack"]
    definition: >-
      The map with roughly three business listings pinned to it, near the top of the
      page. It appears when Google thinks the searcher wants a nearby business. It
      takes a large share of the clicks, and you get into it through your Google
      Business Profile, not through your website.

  - term: Featured Snippet
    aliases: ["Featured Snippet", "answer box", "position 0"]
    definition: >-
      The boxed answer Google lifts out of one page and shows above the results. Won
      by answering a question directly and early on the page.

  - term: Knowledge Panel
    definition: >-
      The information box about a person, place or organisation, usually on the right.
      Google builds it from what it already believes about that entity.

  - term: People Also Ask
    aliases: ["People Also Ask", "PAA"]
    definition: >-
      The expandable list of related questions in the middle of the results page.
      These are real questions Google has seen people ask, which makes them a reliable
      source of headings for your own page.

  - term: AI Overview
    aliases: ["AI Overview", "AI Overviews", "AIO"]
    definition: >-
      The AI-written summary Google places above the results. It answers the question
      on the page itself, so fewer people click through to any website. It cites a
      handful of sources — being one of them is the goal.

  - term: cited-share
    aliases: ["cited-share", "client cited", "cited in the AIO"]
    definition: >-
      The share of your keywords where the AI Overview quotes your site as one of its
      sources. Zero means the AI is answering your topic without crediting you.

  - term: CTR
    aliases: [CTR, "click-through rate"]
    definition: >-
      Click-through rate — of everyone who sees your listing, the percentage who click
      it. "Estimated CTR loss" is a modelled guess at the clicks the AI Overview is
      absorbing, not a measurement of your actual traffic.

  - term: Domain Authority
    aliases: ["Domain Authority", "DA"]
    definition: >-
      A 0–100 third-party score estimating how much ranking strength a whole website
      has, based largely on who links to it. Moz's invention, not Google's, so treat
      it as a rough comparison between sites rather than a fact about your site.

  - term: DA gap
    aliases: ["DA gap", "Gap", "Avg Comp DA"]
    definition: >-
      The average Domain Authority of the sites currently ranking, minus yours. A
      negative gap means you are stronger than the pages you would be competing
      with, so ranking is realistic. A positive gap means they are stronger.

  - term: DA coverage
    aliases: ["DA Coverage", "DA coverage", "unscored"]
    definition: >-
      How much of the ranking page the average rests on, written as "7/10 (3
      unscored)": seven of the ten ranking domains had a Domain Authority record
      and three did not. Read it before the gap. The same gap from three domains is
      a weaker claim than from ten, and nothing else on the row tells you which
      you are looking at. A dash means the coverage was not recorded for that run
      (an older report), which is not the same as nothing having been scored.

  - term: Not measured
    aliases: ["Not measured", "Not Measured"]
    definition: >-
      The tool tried and could not get enough data to answer, so it says so instead
      of guessing. For feasibility it means fewer than five ranking domains carried
      a Domain Authority record, or your own was never measured — not that the
      keyword is hard. The keyword is still listed, with a line under "Not
      measured — why" saying which case it is, and the tool withholds the things
      that would rest on a verdict: no pivot recommendation, no "you are stronger"
      comparison, and no place in the best-opportunity pick. Re-run once the data
      provider is reachable.

  - term: organic position
    aliases: ["organic position", "organic rank", "organic results"]
    definition: >-
      Where your page sits in the ordinary, unpaid list of results. Position 1 is the
      top link. A dash means you were not found in the results checked.

  - term: search intent
    aliases: ["search intent", "SERP intent", "primary intent"]
    definition: >-
      What the searcher is actually trying to do. This report uses four: informational
      (wants to understand something), local (wants somebody nearby), transactional
      (ready to book or buy), and mixed (the results page shows a blend, so Google is
      hedging).

  - term: mixed intent
    aliases: ["mixed intent", "is_mixed"]
    definition: >-
      Google is showing a blend of result types because it is unsure what searchers
      want. It usually means two different pages could both rank, which is an opening.

  - term: backdoor strategy
    aliases: ["backdoor", "backdoor strategy"]
    definition: >-
      Where a keyword has mixed intent, deliberately writing for the less-served side
      of the blend. You avoid the crowded fight and still appear on the same page.

  - term: rank play
    aliases: ["rank play", "rank_play", "Ranking play"]
    definition: >-
      The verdict that this keyword is worth chasing a top-ten position on, because
      your site is strong enough relative to who is already there. Success is measured
      in position.

  - term: extraction play
    aliases: ["extraction play", "extraction_play", "Extraction play"]
    definition: >-
      The verdict that ranking is unrealistic but being quoted is not. You format the
      page so an AI can lift a clean answer out of it — question headings, the answer
      immediately underneath. Success is measured in citations, not position.

  - term: GEO
    definition: >-
      Generative Engine Optimisation — writing so AI answer engines can quote you,
      as opposed to writing to climb the ordinary rankings. The two overlap but the
      scoreboard is different.

  - term: FAQPage markup
    aliases: ["FAQPage markup", "FAQPage", "schema markup", "structured data"]
    definition: >-
      Invisible labelling in the page's code that tells machines "this is a question,
      and this is its answer". It does not change what a human reads; it makes the
      question-and-answer structure unambiguous to Google and to AI engines.

  - term: commodity score
    aliases: ["commodity score", "Commodity", "AI-absorption risk"]
    definition: >-
      A 0–100 estimate of how easily one AI paragraph could replace the entire results
      page for this search. High means everyone is saying the same thing, so a generic
      page is worth little — say something the others do not.

  - term: SERP homogeneity
    aliases: ["SERP homogeneity", "SERP homog."]
    definition: >-
      How alike the competing pages are to each other in type and origin. High
      homogeneity means the whole page is one kind of result, which is either a wall
      to climb or a gap to exploit.

  - term: answer similarity
    aliases: ["answer similarity", "Answer sim."]
    definition: >-
      How much the top results reuse the same wording. It compares words, not meaning,
      so pages that make the same point in different words score as less similar than
      they really are. Read it as a floor.

  - term: entity dominance
    aliases: ["entity dominance", "Entity Dominance"]
    definition: >-
      What kinds of organisation own the results — private practices, directories,
      government, nonprofits. It tells you who you are actually up against, which is
      often a directory rather than a competing counsellor.

  - term: content type
    aliases: ["content type", "Content Type Dominance"]
    definition: >-
      What kind of page is ranking — a guide, a news item, a service page. It tells
      you what format to write in. If guides dominate, a service page will struggle
      however good it is.

  - term: title pattern
    aliases: ["title pattern", "title patterns", "dominant pattern"]
    definition: >-
      The recurring shape of the ranking page titles — "how to…", "best…", "X vs Y",
      a numbered list. Where one shape dominates, it is the format Google is
      rewarding. "No dominant pattern" means titles are varied and the format is open.

  - term: volatility
    aliases: [volatility, "Market Volatility", "rank change"]
    definition: >-
      How much the rankings moved since the last run of the same keywords. It needs
      two runs of the same keyword list to mean anything.

  - term: local pack presence
    aliases: ["Local pack present", "local pack"]
    definition: >-
      Whether the map-and-listings box appeared for this search. When it does, the
      ordinary results start lower down the page and get fewer clicks.
