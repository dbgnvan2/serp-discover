feasibility:
  enabled: true
  # EDITORIAL: the SERP intents for which a neighbourhood pivot is meaningful.
  # Proximity can substitute for domain authority only when the searcher wants
  # a service in a place, so an informational SERP gets no pivot and no
  # neighbourhood variants. A client serving a different market widens this.
  # Must use intent_mapping.yml's vocabulary. Empty/malformed = the documented
  # default (local, transactional) plus a warning.
  pivotable_intents:
  - local
  - transactional
  # EDITORIAL: which entity types count as a directory when the report states
  # the weakest NON-directory competitor beside the mean (D6.1 / D-M-09). A
  # directory holding a top-10 slot says nothing about whether a DA-35 clinic
  # can hold one, so the two minima are reported separately. Must use
  # classification_rules.json's entity_types vocabulary. Empty/malformed =
  # the documented default (directory) plus a warning.
  directory_entity_types:
  - directory
  client_da: 35
  non_profit_location: North Vancouver
  pivot_serp_fetch: true
