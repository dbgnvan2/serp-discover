serpapi:
  engine: google
  gl: ca
  hl: en
  location: North Vancouver,British Columbia,Canada   # SerpAPI canonical_name (locations.json); the client is in North Vancouver, not Vancouver
  num: 100
  device: desktop
  google_max_pages: 3
  google_max_results: 300
  maps_max_pages: 3
  # Read and validated by `http_retry` alongside the `http_retry` block below,
  # with the same warnings and the same documented defaults: junk here used to
  # abort the run at import and a negative backoff reached time.sleep after the
  # first paid call (review chunk Y7). This budget is deliberately one attempt
  # longer than `http_retry.attempts` — a SERP fetch is a paid call against a
  # single vendor and the run cannot continue without it, while a DA lookup has
  # a second provider behind it.
  retry_max_attempts: 3
  retry_backoff_seconds: 1.0
  timeout_seconds: 60   # per SerpAPI call; slowest of 296 logged calls was 30s (2026-11-14)
  resume_max_age_hours: 24   # an unfinished run's stored responses may be reused for this long; 0 = never
  request_delay_seconds: 0.2
  no_cache: false
  ai_fallback_without_location: true
  related_questions_ai_followup: true
  related_questions_ai_max_calls: 5
files:
  input_csv: keywords_family-of-origin-seo-phrases.csv
  output_xlsx: output/market_analysis_family-of-origin-seo-phrases_20261119_1442.xlsx
  output_json: output/market_analysis_family-of-origin-seo-phrases_20261119_1442.json
  output_md: output/market_analysis_family-of-origin-seo-phrases_20261119_1442.md
  domain_overrides: domain_overrides.yml
  # What a header row's first cell can be called, lowercased before
  # comparison. A keyword CSV may or may not have a header — six of this
  # repo's seven have none, and keywords_family-of-origin-seo-phrases.csv is
  # headed `keyword,intent,why_it_matters` — so the word "keyword" was being
  # searched as a keyword. Only the first row is tested. Optional: the
  # shipped default is keyword_input.DEFAULT_HEADER_TOKENS.
  keyword_csv_header_tokens:
  - keyword
  - keywords
  - term
  - terms
  - query
  - queries
  - phrase
  - phrases
  - search term
  - search_term
enrichment:
  enabled: true
  max_urls_per_keyword: 10
  timeout_seconds: 10
  user_agent: MarketIntelligenceBot/1.0
  enable_domain_age: false
app:
  force_local_intent: true
  balanced_mode: true
  deep_research_mode: false
  ai_query_priority_actions:
  - defend
  - strengthen
  - enter_cautiously
moz:
  cache_ttl_days: 30
  # Days a cached *absence* stays good. A row whose domain_authority is NULL
  # records "the provider was asked and holds no figure" — a fact that can
  # change the moment the provider crawls the domain, unlike a measured DA.
  # Holding it for the full cache_ttl_days means a keyword reads
  # "Not Measured" for a month after the figure became available, so
  # absences expire sooner and are re-asked (review chunk D2, finding F6).
  negative_cache_ttl_days: 7
  # Master switch for the Moz Data API (api.moz.com/jsonrpc). Per-method
  # flags are added by their own tasks and gate spend independently.
  enabled: true
  # Monthly data-row allowance for this account, read from the live
  # `quota.lookup` on 2026-08-27 (Starter Medium plan) — NOT a hardcoded plan
  # figure. Re-probe with `quota.lookup` if the plan changes; the API reports
  # `allotted` and `used`, and rows remaining is derived from the two.
  rows_per_month: 3000
  # Keyword metrics (data.keyword.metrics.fetch). ON by default (gate D-2).
  # One API call per keyword — Moz has no batch variant for this method — and
  # a successful fetch bills 4 rows, not 1 (measured live 2026-08-28), so
  # max_keywords is a real spend control: 50 keywords ~= 200 rows.
  # engine/locale/device are all required by the API and all change the
  # answer; en-CA matches the client's market.
  keyword_metrics:
    enabled: true
    engine: google
    locale: en-CA
    device: desktop
    max_keywords: 50
    rows_per_call: 4
    # Editorial (D-M-12 / D4.7): the monthly search volume below which a
    # keyword is called too small to justify dedicated content. The old rule
    # read Google's `total_results` estimate — how many PAGES exist, not how
    # many people search — and a missing estimate counted as zero. A demand
    # conclusion now comes only from a real demand figure, and only when Moz
    # has a record for the keyword in `locale` above.
    min_volume_for_investment: 20
  # Search intent (data.keyword.search.intent.fetch) — a CROSS-CHECK on the
  # repo's own intent_mapping.yml classifier, never a replacement. OFF by
  # default: it is a second opinion on a call the repo already makes, so it
  # should not spend quota unless asked. 1 row per keyword (measured live
  # 2026-08-28), unlike keyword_metrics at 4.
  search_intent:
    enabled: false
    engine: google
    locale: en-CA
    device: desktop
    max_keywords: 50
    rows_per_call: 1
    # Editorial: the two vocabularies differ. Moz has four labels; this repo
    # also emits commercial_investigation, local and uncategorised. This table
    # maps a repo verdict onto Moz's vocabulary so the two can be compared at
    # all. `local` has no Moz equivalent — Moz scores local service queries
    # transactional ("family counselling north vancouver" → transactional,
    # 0.45). An entry of `null` means "not comparable", which is reported as
    # such rather than as a disagreement.
    repo_to_moz_intent:
      informational: informational
      commercial_investigation: commercial
      transactional: transactional
      navigational: navigational
      local: transactional
      uncategorised:
  # T.5 Brand Authority — Moz's 0-100 measure of how established a brand is,
  # independent of link authority. ENABLED here at the user's instruction
  # (the spec's default was false). 1 row per domain. Rides on the competitor
  # fetch, so it needs moz.competitor.enabled too.
  # Real method is data.site.metrics.brand.authority.fetch — the spec's
  # `...metrics.brand_authority.fetch` does not exist on this API.
  brand_authority:
    enabled: true
  # T.5 link momentum. OFF by default and deliberately NOT what the spec
  # described: Moz exposes no recently-gained / recently-lost filter and no
  # time window at all on this plan (the allowed filters are external,
  # follow, nofollow, deleted, not_deleted). What this reports is linking
  # domains lost at some point vs currently live — no 60-day window exists.
  # Costs 2 pages per domain, so `limit` is the real spend control.
  link_momentum:
    enabled: false
    limit: 10
  # Competitor signals for the Tool 2 handoff (data.site.ranking.keyword.list
  # + data.site.anchor.text.list). The spec's default was false; enabled here
  # at the user's instruction (2026-08-28). 1 row per object returned, so cost
  # scales with what each competitor actually has — a full anchor-text page is
  # 25 rows, ranking keywords cost 1 per keyword found.
  # Adding this block moves the handoff to schema_version 1.1; serp-compete's
  # own handoff_schema.json must allow it or Tool 2 hard-exits on validation.
  competitor:
    enabled: true
    # Fetch the CLIENT's own anchor text too, so Tool 2's own-site spam check
    # has data. The client is excluded from the competitor list by design, so
    # without this its anchors never leave this tool and Tool 2's negative-SEO
    # branch cannot fire. Costs one extra anchor page (anchor_text_limit rows).
    client_anchor_texts: true
    scope: domain
    locale: en-CA
    max_competitors: 3
    ranking_keyword_limit: 50
    anchor_text_limit: 25
  # Site metrics (data.site.metrics.fetch.multiple). `scope` must be one of
  # domain, subdomain, subfolder, url — `url` reproduces the page-level PA the
  # legacy endpoint returned. `link_count_fields` is editorial: which of Moz's
  # ~40 link-count fields are kept on each result and cached.
  site_metrics:
    scope: url
    batch_size: 50
    link_count_fields:
    - root_domains_to_root_domain
    - external_pages_to_root_domain
    - nofollow_root_domains_to_root_domain
    - root_domains_to_page
    - external_pages_to_page
    - pages_to_page
situational_probes:
  enabled: false
  max_probes_per_run: 6
  probes_per_keyword: 2
  keywords: priority
bing_check:
  enabled: false
  num: 20
ai_visibility:
  # Which key-registry provider (`~/.config/llm/keys.json`) supplies each
  # engine's API key when the environment does not carry one. The environment
  # always wins: a key placed in `.env` for this tool is never overridden.
  #
  # Editorial: the registry holds eleven providers and WHICH of them this tool
  # may spend is the owner's decision, not the code's. Before this map the
  # four engines read environment variables only while the content brief read
  # the registry, so on a machine whose keys live in the registry the brief
  # was written and all four engines skipped with "KEY is not set" — the key
  # existed and the probe could not see it.
  #
  # A provider named here must be one whose key works against the engine's OWN
  # endpoint. The probes call Anthropic, Gemini, OpenAI and Perplexity direct
  # and ignore a registry `base_url`, so a proxy provider's key would
  # authenticate nowhere.
  #
  # Blank means no provider is configured for that engine, which is a
  # different fact from a provider that failed: the registry holds no
  # Perplexity key on this machine, so that engine needs
  # `PERPLEXITY_API_KEY` in `.env` or it is skipped and reported as not
  # measured. Listed blank rather than omitted so the gap is visible here.
  key_registry_providers:
    ANTHROPIC_API_KEY: anthropic
    OPENAI_API_KEY: openai-serp
    GEMINI_API_KEY: gemini-serp
    PERPLEXITY_API_KEY: ""
  # Y5 cold review — the classifier categories in which a cited domain
  # carrying no `known_brands` entry is a rival the gazetteer is missing. A
  # directory or a publisher has no brand by design, so the whole-table count
  # is high on every run and says nothing; this is the subset worth acting on.
  # Editorial: which categories hold this client's rivals.
  brand_relevant_categories:
  - counselling
  - nonprofit
  # Y5 — how long one engine answer may take. Far longer than an API call
  # (`http_retry.timeout_seconds`) because these models search the web before
  # answering; the API figure would file most probes as failures. A
  # non-positive or non-numeric value is reported and the default (60) used.
  timeout_seconds: 60
  # Engine defaults (gate Y-D9, user-approved): Gemini + ChatGPT ON (reach +
  # Google-organic carryover), Perplexity ON (referral-click value), Claude
  # available-but-not-default. Each engine still runs only if its API key is
  # present; a missing key skips it with a warning, never an abort.
  engines:
  - gemini
  - openai
  - perplexity
  claude_model: claude-sonnet-4-6
  claude_web_search_tool: web_search_20260209
  gemini_model: gemini-2.5-flash
  # OpenAI / ChatGPT (Y.2): web-search-enabled Responses API.
  openai_model: gpt-4o
  openai_endpoint: https://api.openai.com/v1/responses
  openai_web_search_tool: web_search
  # Perplexity (Y.3): Sonar search-grounded model, OpenAI-compatible endpoint.
  perplexity_model: sonar
  perplexity_endpoint: https://api.perplexity.ai/chat/completions
  max_questions: 20
  max_total_calls: 60
  client_slug: living_systems
  assume_yes: false
  history_runs: 5
  geo_context: I'm in North Vancouver, BC.
  # D-M-14 (D3b) — editorial word lists. Both are vocabulary, not logic.
  #
  # generic_source_stoplist: harvested competitor "Source" labels that are
  # ordinary words, not brands. The gazetteer harvests these from the market
  # analysis JSON, and a single generic token matched plain answer text and
  # took a leaderboard rank beside a real competitor ("Indeed" matched "indeed,
  # family therapy helps"). A harvested name is otherwise kept only when it has
  # two or more words, or is a single word matching ANY label of its own row's
  # host — "Indeed" beside ca.indeed.com is a brand, "Pathways" beside vch.ca
  # is not. Public-suffix and hosting labels ("ca", "com", "www2") never count.
  # `known_brands` is never filtered — if you listed it, it is a brand.
  generic_source_stoplist:
  - indeed
  - pathways
  - resources
  - directory
  - home
  - about
  - services
  - contact
  - overview
  - search
  # negative_terms: phrases that contain a client name pattern but are NOT a
  # mention of the client. "Living Systems" is also the name of an academic
  # subject this client teaches about, so an answer explaining living systems
  # theory counted as the AI naming the practice. The veto is applied PER MATCH,
  # not per answer: an AI answer may explain the theory in one paragraph and
  # name the practice in the next, so a client-pattern hit is rejected only when
  # that occurrence lies inside one of these phrases. (gsc_demand.negative_terms
  # vetoes the whole string, which is right for a Search Console query of a few
  # words but wrong for a multi-paragraph answer.) One matcher — brand_match.
  # matches_patterns — applies this to the mention flag, the competitor
  # leaderboard and the sentiment gate alike.
  negative_terms:
  - living systems theory
  - living systems approach
  # D5/AV.5.1 — retain the FULL AI answer text (not just the 400-char excerpt) in
  # the ai_visibility_probes.raw_answer column for an audit trail. OFF by default:
  # full answers are unbounded and may carry PII. When on, each is capped at
  # raw_answer_max_chars.
  store_raw_answer: false
  raw_answer_max_chars: 10000
# ---------------------------------------------------------------------------
# Phase D report enrichment (Yoast GEO upgrade Y.6–Y.9). All read-side: they
# add stored metrics + report sections from the answers already fetched (no new
# engine calls except Y.9's opt-in sentiment classification).
# ---------------------------------------------------------------------------
aivi:
  # AI Visibility Index composite weighting across the four axes (Y-D6). Equal
  # 25% each by default; documented in docs/methodology.md so the score is
  # defensible and tunable. Malformed/missing weights fall back to equal with a
  # warning. Never hardcoded — the score is always computed from these.
  weights:
    mentions: 0.25
    ranking: 0.25
    citations: 0.25
    sentiment: 0.25
brand_mentions:
  # Y.7 competitor mention leaderboard. The deterministic gazetteer pass
  # (known_brands + analysis-JSON competitors) always runs. The gated LLM pass
  # that fills unknown brands is OFF by default (Y-D7) — turn on only after you
  # trust the candidate-review file. Model id from config (never hardcoded).
  llm_extraction: false
  llm_model: gemini-4-hydrogen
sentiment:
  # Y.9 per-brand sentiment. OFF by default (Y-D8): a disabled run makes zero
  # sentiment calls, the report reads "not measured", and AIVI excludes the
  # axis. Each classification counts against ai_visibility.max_total_calls.
  enabled: false
  llm_model: gemini-4-hydrogen
# ---------------------------------------------------------------------------
# Phase E engine strategy (Yoast GEO upgrade Y.10–Y.12). All read-side: pure
# aggregation of already-collected signals (no new engine calls).
# ---------------------------------------------------------------------------
foundational:
  # Y.12 foundational (transferable) GEO readiness score. Three sub-scores —
  # accessibility/extractability, structure/schema, off-site authority —
  # weighted into a single 0–100 that lifts the client on every engine at once.
  # Equal thirds by default; documented in docs/methodology.md. A sub-score
  # with no captured data is n/a and excluded from the mean (renormalised),
  # never counted as 0. Malformed/missing weights fall back to equal + warning.
  weights:
    accessibility: 0.3333
    structure: 0.3333
    authority: 0.3334
engine_prioritization:
  # Y.10 platform-prioritisation blend. Ranks the ENABLED engines for this
  # client by a documented, config-weighted blend of three normalised 0–1
  # signals: opportunity (low current AIVI = high opportunity), reach tier,
  # and referral-click tier (the latter two from engine_profiles.yml). This is
  # INDICATIVE guidance, not a fixed ranking — prioritisation is audience
  # dependent (a Google-organic audience favours Google AI surfaces first).
  weights:
    opportunity: 0.5
    reach: 0.3
    referral: 0.2
aio_exposure:
  # D1 (AV.1) AI Overview zero-click exposure. Estimates the organic click-
  # through the Google AI Overview intercepts per keyword, from signals already
  # on keyword_profiles (no new fetch, no LLM call). ALL values here are INDUSTRY
  # REFERENCE POINTS, not measured livingsystems.ca CTR — the report labels them
  # "estimated". Malformed/missing values fall back to these documented defaults
  # with a warning (mirrors aivi.weights). Documented in docs/methodology.md.
  aio_ctr_multiplier: 0.6    # share of organic clicks an AIO intercepts
  citation_credit: 0.5       # a client citation inside the AIO recovers half the loss
  # D5.6 — where each of the three modelled numbers comes from. "Industry
  # reference point" named no study and no date, and third-party CTR figures
  # move year to year, so the report states them as the owner's assumption
  # until these name a source and a date. Editorial: write the citation here
  # (e.g. "Acme CTR study, published 2026-02, retrieved 2026-03-01").
  sources:
    aio_ctr_multiplier: ""
    citation_credit: ""
    ctr_curve: ""
  history_runs: 5            # runs shown in the exposure trend
  ctr_curve:                 # reference organic CTR by 1-based SERP position
    1: 0.28
    2: 0.15
    3: 0.1
    4: 0.07
    5: 0.05
    6: 0.04
    7: 0.03
    8: 0.025
    9: 0.02
    10: 0.015
commodity:
  # D4 (AV.4) query commodity / AI-absorption risk. A deterministic 0-100 blend
  # (no LLM on the report path) of answer_similarity (top-N result title+snippet
  # token-set Jaccard), serp_homogeneity (entity + title-pattern concentration),
  # and aio_present. Weights fall back to these documented defaults + a warning if
  # malformed (mirrors aivi.weights). The one_paragraph_answerable LLM term is OFF
  # by default (its weight renormalises out). Bands: < medium = low, >= high = high.
  weights:
    answer_similarity: 0.4
    serp_homogeneity: 0.3
    aio_present: 0.2
    one_paragraph_answerable: 0.1
  top_n_results: 5
  bands:
    medium: 40
    high: 70
http_retry:
  # Y4 — the retry policy for every outbound call that is not SerpAPI:
  # DataForSEO, Moz, Google Search Console, the AI-engine probes and the page
  # fetch. SerpAPI has had its own keys (serpapi.retry_max_attempts /
  # retry_backoff_seconds) since the start; these were Python constants, so
  # one of the tool's two retry policies could be tuned and the other could
  # not. Editorial: how long a run should spend on a failing host before it
  # files the result as unread is a judgement about the connection it runs on.
  # A retry policy of zero would make every transient failure terminal (P1),
  # so a non-positive value is reported and the default used.
  attempts: 2
  backoff_seconds: 1.0
  # Cap on a server's own Retry-After header, so a host asking for an hour
  # cannot stall the run.
  max_retry_after_seconds: 30.0
  # Y5 — how long one API call may take before it counts as a failure:
  # DataForSEO, Moz, Google Search Console. This was a per-module Python
  # constant repeated in four clients, so it could not be tuned at all.
  # A timeout cannot be switched off: a non-positive or non-numeric value is
  # reported and the default (30) used. The tool's other two waits are longer
  # and shorter on purpose and stay with the work they belong to —
  # `enrichment.timeout_seconds` for one ranked competitor page, and
  # `ai_visibility.timeout_seconds` for an LLM answer.
  timeout_seconds: 30

database:
  # Y11 — how long a writer waits for another writer's SQLite lock before the
  # write fails with `database is locked`. It was sqlite3's own default of 5,
  # passed by nobody and choosable by nobody, while the GUI runs
  # `refresh_analysis_outputs` in the same process as a run and the AI probe
  # writes the same file. Editorial: how long a concurrent write may block is
  # a judgement about how this tool is driven. A wait cannot be switched off —
  # a non-positive or non-numeric value is reported and the default (5) used.
  lock_timeout_seconds: 5.0

  # Where the SQLite history database lives. Relative paths are resolved
  # against the repo root, never the current working directory: the path was
  # the bare literal `serp_data.db` at 24 sites, so running a reader from
  # anywhere else created a new empty database beside the caller instead of
  # reporting that the history was missing (review chunk Y12). An absolute
  # path is used as given; `~` is expanded. A blank or non-string value is
  # reported and the default used.
  path: serp_data.db

gsc:
  # Google Search Console integration (run_gsc_analysis.py). Free
  # first-party data, but off by default until the service-account grant
  # (gate D-3) is in place: set GSC_CREDENTIALS_PATH and add the
  # service-account email to the Search Console property.
  enabled: false
  property: sc-domain:livingsystems.ca
  lookback_days: 90
  cache_ttl_days: 7
  # D5.1/D5.2 — the sponge rollup and the reformat shortlist both ignore
  # queries with too little traffic to read a CTR from: one click on three
  # impressions is a 33% CTR and means nothing. Editorial: it is a judgement
  # about how much traffic this client's pages get.
  min_impressions: 50
  # D5.2 — how far below the no-AIO median CTR a query must sit before it is
  # called a reformat candidate. 0.25 = at least 25% below. Editorial: a
  # tighter margin shortlists more pages. Below the median is not, by itself,
  # a finding — half of every set is below its own median.
  reformat_ctr_margin: 0.25
  # Y4 — the sponge comparison's shape. `min_bucket_size` is how many queries
  # each side of the AIO/no-AIO comparison needs before a band reports one at
  # all; `position_bands` are the rank bands the CTRs are compared within, so
  # like is compared with like. Editorial: a property with few tracked
  # queries reports nothing at a bucket size of 3, and the bands are a
  # judgement about where this property's traffic sits.
  min_bucket_size: 3
  position_bands:
  - [1, 3]
  - [4, 10]
  - [11, 20]
  # The deepest ranking position the reformat shortlist will consider.
  # Editorial, and it has to agree with position_bands: a client whose pages
  # sit at 11-20 needs both widened, or the shortlist is always empty.
  reformat_max_position: 10
  # D5.7 — which country and device the GSC pull is restricted to, so the
  # clicks are measured over the same population as the SERP fetch. Default
  # (when the key is absent) mirrors serpapi.gl / serpapi.device. Set either
  # to 'all' to pull every country / every device on purpose; the report then
  # says the two sides are not comparable. country takes a 2- or 3-letter
  # ISO-3166-1 code, device one of desktop / mobile / tablet.
  country: ca
  device: desktop
  # When true, generate_content_brief attaches the latest gsc_analysis_*
  # sidecar as gsc_summary to the LLM payload (client-private data).
  feed_strategic_flags: false
gsc_demand:
  # D2 (AV.2) branded vs non-branded demand (run_gsc_analysis.py). Classifies the
  # run's GSC queries as name-seeking (branded) using analysis_report.client_name_
  # patterns, and trends the branded click share across runs. The bands are
  # INDUSTRY REFERENCE points (below-avg < 2.4%, top >= 10%), labelled as reference
  # in the report — not targets for this client. Malformed → defaults + warning.
  bands:
    below_avg: 0.024
    top: 0.1
    # D5.4 — where these two figures come from. No published source was ever
    # recorded for them, so the report states them as the owner's assumption
    # until this names a study and a date. Editorial: write the citation here
    # (e.g. "Acme 2026 benchmark report, retrieved 2026-03-01") and the report
    # prints it instead.
    source: ""
  # Optional generic words that contain the brand but are not name-seeking
  # (e.g. a common word) — excluded from branded classification.
  negative_terms: []
# EDITORIAL: where each verdict-deciding threshold family came from, printed
# in the report's appendix (review finding D-M-21). One line per family, in
# the owner's own words — a study and a date ("Acme 2026 CTR study, retrieved
# 2026-03-01"), a decision record ("editorial, owner 2026-07-06; approved
# against the reference run"), or a calibration. Leave a family out, or
# blank, and the report says "editorial, uncalibrated — no source or date is
# recorded for this one", which is the honest answer until somebody writes
# one. Family names must match thresholds_provenance.FAMILIES; an unknown
# name is reported and not printed.
thresholds_provenance:
  feasibility: ""
  serp_intent: ""
  title_patterns: ""
  commodity: ""
  aivi: ""
  foundational: ""
  engine_prioritization: ""
  gsc_demand: ""
  entity_dominance: ""
title_patterns:
  # EDITORIAL: how many of the analysed titles must share a shape before the
  # tool calls it the SERP's dominant pattern, and how many titles it looks at.
  # These were Python constants in title_patterns.py while every threshold
  # family beside them was config, and `dominant_pattern` is a claim the brief
  # restates and the validator HARD-fails on (review chunk Y1, finding W).
  dominant_threshold: 4
  top_n: 10

serp_intent:
  thresholds:
    # EDITORIAL: how much of a result page has to agree before the tool calls
    # one intent the primary one, and how clearly it has to lead before the
    # verdict is called certain. Every key here has a reader in
    # intent_verdict.py; a test enforces that, because confidence_high and
    # confidence_medium were validated, documented and GUI-editable for
    # months with nothing reading them (D-C-17).
    primary_share: 0.6
    fallback_share: 0.4
    fallback_runner_up_max: 0.2
    # Share of the CLASSIFIED urls the leading intent must hold for the
    # verdict's certainty to read high / medium. Read by
    # intent_verdict._bucket_certainty since D6.3. Not the same thing as
    # classification coverage, which is a count of how many urls could be
    # classified at all and rises with enrichment.max_urls_per_keyword.
    confidence_high: 0.8
    confidence_medium: 0.5
