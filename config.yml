serpapi:
  engine: google
  gl: ca
  hl: en
  location: Vancouver, British Columbia, Canada
  num: 100
  device: desktop
  google_max_pages: 3
  google_max_results: 300
  maps_max_pages: 3
  retry_max_attempts: 3
  retry_backoff_seconds: 1.0
  request_delay_seconds: 0.2
  no_cache: false
  ai_fallback_without_location: true
  related_questions_ai_followup: true
  related_questions_ai_max_calls: 5
files:
  input_csv: keywords_leila.csv
  output_xlsx: output/market_analysis_leila_20260505_1435.xlsx
  output_json: output/market_analysis_leila_20260505_1435.json
  output_md: output/market_analysis_leila_20260505_1435.md
  domain_overrides: domain_overrides.yml
enrichment:
  enabled: true
  max_urls_per_keyword: 5
  timeout_seconds: 10
  user_agent: MarketIntelligenceBot/1.0
  enable_domain_age: false
app:
  force_local_intent: true
  balanced_mode: true
  deep_research_mode: false
  ai_query_priority_actions:
  - defend
  - strengthen
  - enter_cautiously
moz:
  cache_ttl_days: 30
situational_probes:
  enabled: false
  max_probes_per_run: 6
  probes_per_keyword: 2
  keywords: priority
bing_check:
  enabled: false
  num: 20
ai_visibility:
  # Engine defaults (gate Y-D9, user-approved): Gemini + ChatGPT ON (reach +
  # Google-organic carryover), Perplexity ON (referral-click value), Claude
  # available-but-not-default. Each engine still runs only if its API key is
  # present; a missing key skips it with a warning, never an abort.
  engines:
  - gemini
  - openai
  - perplexity
  claude_model: claude-sonnet-4-6
  claude_web_search_tool: web_search_20260209
  gemini_model: gemini-2.5-flash
  # OpenAI / ChatGPT (Y.2): web-search-enabled Responses API.
  openai_model: gpt-4o
  openai_endpoint: https://api.openai.com/v1/responses
  openai_web_search_tool: web_search
  # Perplexity (Y.3): Sonar search-grounded model, OpenAI-compatible endpoint.
  perplexity_model: sonar
  perplexity_endpoint: https://api.perplexity.ai/chat/completions
  max_questions: 20
  max_total_calls: 60
  client_slug: living_systems
  assume_yes: false
  history_runs: 5
  geo_context: I'm in North Vancouver, BC.
# ---------------------------------------------------------------------------
# Phase D report enrichment (Yoast GEO upgrade Y.6–Y.9). All read-side: they
# add stored metrics + report sections from the answers already fetched (no new
# engine calls except Y.9's opt-in sentiment classification).
# ---------------------------------------------------------------------------
aivi:
  # AI Visibility Index composite weighting across the four axes (Y-D6). Equal
  # 25% each by default; documented in docs/methodology.md so the score is
  # defensible and tunable. Malformed/missing weights fall back to equal with a
  # warning. Never hardcoded — the score is always computed from these.
  weights:
    mentions: 0.25
    ranking: 0.25
    citations: 0.25
    sentiment: 0.25
brand_mentions:
  # Y.7 competitor mention leaderboard. The deterministic gazetteer pass
  # (known_brands + analysis-JSON competitors) always runs. The gated LLM pass
  # that fills unknown brands is OFF by default (Y-D7) — turn on only after you
  # trust the candidate-review file. Model id from config (never hardcoded).
  llm_extraction: false
  llm_model: claude-sonnet-4-20250514
sentiment:
  # Y.9 per-brand sentiment. OFF by default (Y-D8): a disabled run makes zero
  # sentiment calls, the report reads "not measured", and AIVI excludes the
  # axis. Each classification counts against ai_visibility.max_total_calls.
  enabled: false
  llm_model: claude-sonnet-4-20250514
# ---------------------------------------------------------------------------
# Phase E engine strategy (Yoast GEO upgrade Y.10–Y.12). All read-side: pure
# aggregation of already-collected signals (no new engine calls).
# ---------------------------------------------------------------------------
foundational:
  # Y.12 foundational (transferable) GEO readiness score. Three sub-scores —
  # accessibility/extractability, structure/schema, off-site authority —
  # weighted into a single 0–100 that lifts the client on every engine at once.
  # Equal thirds by default; documented in docs/methodology.md. A sub-score
  # with no captured data is n/a and excluded from the mean (renormalised),
  # never counted as 0. Malformed/missing weights fall back to equal + warning.
  weights:
    accessibility: 0.3333
    structure: 0.3333
    authority: 0.3334
engine_prioritization:
  # Y.10 platform-prioritisation blend. Ranks the ENABLED engines for this
  # client by a documented, config-weighted blend of three normalised 0–1
  # signals: opportunity (low current AIVI = high opportunity), reach tier,
  # and referral-click tier (the latter two from engine_profiles.yml). This is
  # INDICATIVE guidance, not a fixed ranking — prioritisation is audience
  # dependent (a Google-organic audience favours Google AI surfaces first).
  weights:
    opportunity: 0.5
    reach: 0.3
    referral: 0.2
aio_exposure:
  # D1 (AV.1) AI Overview zero-click exposure. Estimates the organic click-
  # through the Google AI Overview intercepts per keyword, from signals already
  # on keyword_profiles (no new fetch, no LLM call). ALL values here are INDUSTRY
  # REFERENCE POINTS, not measured livingsystems.ca CTR — the report labels them
  # "estimated". Malformed/missing values fall back to these documented defaults
  # with a warning (mirrors aivi.weights). Documented in docs/methodology.md.
  aio_ctr_multiplier: 0.60   # ~60% AIO CTR-interception reference (industry)
  citation_credit: 0.5       # a client citation inside the AIO recovers half the loss
  history_runs: 5            # runs shown in the exposure trend
  ctr_curve:                 # reference organic CTR by 1-based SERP position
    1: 0.28
    2: 0.15
    3: 0.10
    4: 0.07
    5: 0.05
    6: 0.04
    7: 0.03
    8: 0.025
    9: 0.02
    10: 0.015
gsc:
  # Google Search Console integration (run_gsc_analysis.py). Free
  # first-party data, but off by default until the service-account grant
  # (gate D-3) is in place: set GSC_CREDENTIALS_PATH and add the
  # service-account email to the Search Console property.
  enabled: false
  property: sc-domain:livingsystems.ca
  lookback_days: 90
  cache_ttl_days: 7
  # When true, generate_content_brief attaches the latest gsc_analysis_*
  # sidecar as gsc_summary to the LLM payload (client-private data).
  feed_strategic_flags: false
serp_intent:
  thresholds:
    primary_share: 0.6
    fallback_share: 0.4
    fallback_runner_up_max: 0.2
    confidence_high: 0.8
    confidence_medium: 0.5
known_brands: []
client:
  preferred_intents:
  - informational
  - transactional
  - local
feasibility:
  enabled: true
  client_da: 35
  non_profit_location: North Vancouver
  pivot_serp_fetch: true
  neighborhoods:
  - West Vancouver
  - North Vancouver
  - Lonsdale
  - Edgemont Village
  - Lynn Valley
  - Deep Cove
  - Canyon Heights
audit_targets:
  n: 10
  omit_from_audit: []
analysis_report:
  client_name: Living Systems Counselling
  client_domain: livingsystems.ca
  client_name_patterns:
  - Living Systems
  org_type: Small nonprofit counselling organization, established 1971
  location: North Vancouver, BC, Canada
  framework_description: Bowen Family Systems Theory. Core concepts include differentiation
    of self, emotional cutoff, sibling position, child projection, triangles, and
    multigenerational transmission.
  content_focus: Counselling services, Bowen Theory training programs, conferences,
    and educational content.
  additional_context: Budget is limited. Prioritize practical recommendations that
    fit a small nonprofit and avoid mismatched audiences such as court-mandated reunification
    services.
report_thresholds:
  entity_dominance:
    counselling_directory_combined: 0.4
    education: 0.15
    government: 0.2
geo:
  # Entity types treated as outreach (brand-placement) surfaces in the AIO
  # citation analysis, as opposed to competitor counselling sites.
  outreach_entity_types:
  - directory
  - media
  - nonprofit
  - professional_association
  - education
  - government
