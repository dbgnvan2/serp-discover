launcher:
  stop_grace_seconds: 5            # Stop button: wait this long after asking the run to end, then force it
  max_run_minutes: 0               # end a run that lasts longer than this; 0 = no limit
  regenerate_timeout_seconds: 300  # report regeneration after a feasibility run
  process_check_timeout_seconds: 5 # the "is a pipeline already running?" check
# ---------------------------------------------------------------------------
# Which LLM writes the Content Opportunity report and the advisory briefing.
# `provider` is the name of an entry in the shared key registry
# (~/.config/llm/keys.json). Leave it empty to use the registry's `apps` map
# for serp-discover, then the registry default. If the provider fails, the run
# fails: there is no fallback to another provider or model.
# The two models must belong to that provider. To go back to Claude, set
# provider to an Anthropic entry and both models to Claude model IDs.
# brand_mentions.llm_model and sentiment.llm_model (above) are sent to this
# same provider when those features are switched on.
# ---------------------------------------------------------------------------
report_llm:
  provider: gemini-serp
  main_model: gemini-4-hydrogen
  advisory_model: gemini-4-hydrogen
  # Seconds allowed for one report call. A full report can take minutes.
  timeout_seconds: 600
  # Output-token limits for the main report and the advisory briefing. A model
  # that reasons before answering (Hydrogen does) spends part of this limit on
  # reasoning, so it needs far more than the length of the report. An answer
  # that hits the limit fails the run; nothing is written.
  main_max_tokens: 64000
  advisory_max_tokens: 16000
  # Launcher dropdowns: a live model is offered when its ID starts with one of
  # model_include and contains none of model_exclude.
  model_include:
  - gemini-
  - claude-
  model_exclude:
  - image
  - tts
  - audio
  - live
  - embedding
  - robotics
  - transcribe
  - banana
  - computer-use
