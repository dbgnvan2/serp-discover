# Feasibility vocabulary — the words and icons the reports use for a
# feasibility verdict, and the sentences they print when there is no verdict
# to give.
#
# Editorial content: every string here is a judgement about how to tell the
# reader what was and was not measured, and a non-developer may reasonably
# want to reword any of it. It lived in Python in four places — two inline
# dicts in serp_audit.py, one module constant in run_feasibility.py and one
# function-local dict in generate_insight_report.py — which is how
# "No DA Data" and "Not Measured" came to mean the same thing with different
# wording in different outputs.
#
# Added by review chunk D2a (D-C-03/D-M-08). Loaded by
# feasibility.load_messages(); a missing or malformed file degrades to the
# bare status string, never an aborted report.

# One label per status. The keys are the statuses feasibility.py returns and
# must match feasibility.StatusLiteral exactly — a test asserts they do.
#
# `icon` is the bare glyph (the audit's console line); `label` is the glyph
# plus the words (the report tables and the feasibility markdown).
statuses:
  High Feasibility:
    icon: "✅"
    label: "✅ High"
  Moderate Feasibility:
    icon: "⚠️"
    label: "⚠️ Moderate"
  Low Feasibility:
    icon: "🔴"
    label: "🔴 Low"
  Not Measured:
    icon: "❓"
    # The glyph here is the `icon` above, not another one. "Not measured" wore
    # ❓ in the audit console line and ⚠️ in the report tables — and ⚠️ is
    # also "Moderate Feasibility"'s icon, so the two states shared a glyph
    # while one state had two (review chunk Y1 cold review).
    label: "❓ Not measured"

# What to say when a keyword has no measurable gap. The three cases call for
# different action, so they are not one sentence: no provider is an operator
# fix, an unscored SERP is a fact about that keyword, and thin coverage is a
# number the reader should see.
#
# Placeholders: {provider} the DA provider's name, {measured} how many ranking
# domains had a DA record, {window} how many were considered, {minimum} how
# many a verdict needs.
no_measurement:
  no_provider: >-
    No DA provider reachable — set DATAFORSEO_LOGIN/PASSWORD or MOZ_TOKEN and
    run again.
  nothing_in_window: >-
    No ranking competitor could be scored for this keyword ({provider} was
    queried). Nothing to pivot away from yet.
  below_minimum: >-
    Only {measured} of {window} ranking domain(s) have a DA record from
    {provider}, below the {minimum} a verdict needs. The mean is reported with
    its coverage; no pivot is recommended from it.

# How a row states what its average rests on. Rendered beside every mean so a
# figure drawn from three of ten domains cannot read like one drawn from all
# ten (P2).
#
# Placeholders: {measured}, {window}, {missing} as above.
coverage:
  complete: "mean of all {window} ranking domains"
  partial: "mean of {measured} of {window} ranking domains ({missing} unscored)"
  none: "no ranking domain scored"

# The same fact in a table column, where the sentence above will not fit. The
# numbers are the same numbers; only the words are shorter.
coverage_short:
  complete: "{window}/{window}"
  partial: "{measured}/{window} ({missing} unscored)"
  none: "0/{window}"

# A row from a run written before coverage was recorded. Absent is a third
# state: printing it as 0 of 0 states a complete failure to measure beside a
# mean that was in fact measured.
coverage_unknown:
  long: "coverage not recorded for this run"
  short: "—"

# How a Client DA cell says where its own figure came from. A config value is
# not a measurement, and a report that prints it bare invites the reader to
# subtract it from a measured competitor mean as though the two were on one
# scale (D-M-05).
#
# Placeholders: {da} the value, {provider} the active DA provider.
client_da:
  measured: "{da}"
  override: "{da} (override)"
  config_fallback: "{da} (config, not measured by {provider})"
  not_measured: "not measured"
  # A row with no client_da_source: written before the provenance was
  # recorded, so whether this figure was measured is unknown. Not "measured".
  unknown_source: "{da} (source not recorded)"

# What the mean cannot say. The mean answers "how strong is this page on
# average"; a DA-35 nonprofit is asking "does anything my size hold a slot
# here", and the answer is the weakest competitor that is not a directory.
# A SERP of one DA-92 directory plus nine DA-18 clinics has a mean of 25 and
# reads easy; one of five DA-85 sites plus five DA-12 clinics has a mean of
# 48 and reads hard, although the second page demonstrably has room
# (D-M-09 / D6.1).
#
# Placeholders: {min_da} weakest measured competitor, {min_non_directory_da}
# weakest that is not a directory, {n} competitors the figures rest on,
# {directory_types} the configured directory entity types.
minima:
  # Both figures available: the one that answers the question comes first.
  with_non_directory: >-
    The weakest page holding a slot that is not a {directory_types} scores
    {min_non_directory_da}, and the weakest of any kind {min_da}, over {n}
    scored competitors — that is what says whether a site your size has room
    here, not the average.
  # Only some of the scored competitors had a resolved entity type. The
  # non-directory figure stands over those, not over the window — saying
  # otherwise asserts a classification nobody made (D6 cold review).
  with_non_directory_partial: >-
    Of the {known} of {n} scored competitors whose type could be resolved, the
    weakest that is not a {directory_types} scores {min_non_directory_da}; the
    weakest of any kind is {min_da}. The other {unknown} were not classified,
    so a page weaker than that may hold a slot here too.
  # Every *classified* competitor is a directory, but some were not classified.
  all_classified_directory: >-
    Every one of the {known} of {n} scored competitors whose type could be
    resolved is a {directory_types}; the other {unknown} were not classified,
    so this page shows no evidence either way about an ordinary site your size.
    The weakest of all {n} scores {min_da}.
  # Entity types were resolved and every scored competitor is a directory.
  all_directory: >-
    Every one of the {n} scored competitors is a {directory_types}, so this
    page shows no evidence either way about an ordinary site your size; the
    weakest of them scores {min_da}.
  # No entity type was resolved for any scored competitor. Not "no
  # directories rank here" — nobody classified them.
  entities_unknown: >-
    The weakest page holding a slot scores {min_da} over {n} scored
    competitors. None of them carries an entity type this run, so the
    directory split is not measured.

# What the report says in place of the feasibility section when no DA was
# measured at all. The reader of that section is being told to do something,
# so it names the two providers and the step that fetches the data.
#
# Why it is here: the words were a Python literal in
# generate_insight_report.py, and one of them was a plan figure — "MOZ_TOKEN
# in .env (free tier, 50 rows/month)" — which is wrong for this account (the
# Moz plan is Starter Medium) and is the one number CLAUDE.md says must never
# be hardcoded, because the real allowance is read at runtime via
# `quota.lookup` and recorded as `moz.rows_per_month`. A report printing a
# stale plan figure as instruction is worse than one printing none. The
# allowance is deliberately absent below: the provider knows it, this file
# does not.
#
# Found by the second live run after the 2026-11-04 review (2026-11-18). The
# same run showed why the section renders at all on a correctly configured
# machine: `run_pipeline.py` runs steps 1.1-1.4 and feasibility is not one of
# them, so a pipeline run alone never fetches DA however the credentials are
# set. The last line says so.
#
# Placeholders: none.
no_data_section:
  heading: "**⚠️ Feasibility data unavailable for this run.**"
  # A literal block, not a folded one: the blank lines are markdown structure
  # (a list, then two paragraphs) and folding them away runs the paragraphs
  # into the list.
  body: |-
    Domain Authority scoring requires credentials, or more quota on the
    account behind them. One of:

    - `DATAFORSEO_LOGIN` + `DATAFORSEO_PASSWORD` in `.env` (pay-per-use, primary)
    - `MOZ_TOKEN` in `.env` (fallback; the row allowance is read from the
      account at runtime, not set here)

    Without DA data, keyword ranking is based on intent alignment only (see
    Section 0).

    A run that answered for only a few of the ranking URLs, or none, is
    usually quota rather than configuration — the provider says so in the
    `run_feasibility.py` log, and a 403 `insufficient-quota` from Moz means
    the period's rows are spent, not that the token is wrong.

    Credentials alone do not produce this section: DA is fetched by
    `run_feasibility.py`, which `run_pipeline.py` does not run. Run it against
    this run's `market_analysis_*.json` to fill the section in.
