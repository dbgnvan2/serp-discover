# strategic_patterns.yml
#
# Bowen theory strategic pattern definitions for SERP analysis.
#
# HOW TRIGGERS WORK
# -----------------
# A pattern fires when ANY trigger appears as a whole word (word-boundary
# match, case-insensitive) in the SERP ngram corpus for a run. This means:
#   - "mean"  matches "being mean to you"  ✓
#   - "mean"  does NOT match "shared meaning" or "meaningful" ✓
# Matching is substring-safe; word boundaries are enforced in code.
#
# WHAT MAKES A GOOD TRIGGER
# --------------------------
# Triggers should be vocabulary that signals a searcher is operating INSIDE
# the trap — language that reveals the framing you want to reframe.
# Good triggers: specific to the trap's worldview, unlikely to appear in
#   neutral therapeutic language ("narcissist", "sliding scale", "diagnosis").
# Bad triggers: common words that appear everywhere in the topic domain
#   ("help", "work", "good", "feel") — they will fire on almost every run.
# Minimum length: 4 characters. Shorter triggers match too broadly even
#   with word boundaries ("is", "in", "me" appear in every corpus).
#
# ADDING A NEW PATTERN
# --------------------
# Append an entry with all five required fields. No Python changes needed.
# Field names must match exactly — they are written directly into the JSON output.
#
# CONTENT_ANGLE_EXAMPLE (optional, CD.7)
# --------------------------------------
# Content_Angle states the argument in the abstract. Content_Angle_Example turns
# it into a concrete opening the writer can start from — two or three sentences
# showing what the angle sounds like on the page, not a whole post.
#
# It may use these placeholders, filled from the run this pattern fired on:
#   {keyword}   the keyword the pattern was anchored to
#   {question}  a real People Also Ask question from that keyword
#   {term}      that keyword's most repeated competitor phrase
# A placeholder with no data for the run drops the sentence containing it, so an
# example never renders with an empty slot. A pattern with no example simply
# renders without one.

- Pattern_Name: The Medical Model Trap
  Relevant_Intent_Class: External Locus
  Triggers:
    - clinical
    - registered
    - diagnosis
    - disorder
    - mental health
    - patient
    - treatment
  Status_Quo_Message: >-
    You are sick/broken and need an expert to fix you (External Locus of Control).
  Bowen_Bridge_Reframe: >-
    Shift from pathology to functioning. You don't need a diagnosis;
    you need a map of your emotional system.
  Content_Angle: >-
    Why turning relationship problems into a diagnosis keeps you stuck.
  Content_Angle_Example: >-
    Opening it might sound like: "Someone searching '{keyword}' has usually
    already been handed a label — for themselves, or for a family member. The
    label explains the person. It does not explain the pattern the person is
    caught in, which is why treating the label so often leaves the pattern
    exactly where it was." Then take the reader through one pattern instead of
    one diagnosis.

- Pattern_Name: The Fusion Trap
  Triggers:
    - connection
    - bond
    - close
    - intimacy
    - communication
    - reconnect
    - reach out
  Status_Quo_Message: >-
    The goal is to force closeness, agreement, or reconnection as quickly as possible.
  Bowen_Bridge_Reframe: >-
    Sustainable contact requires differentiation. Anxiety-driven pursuit often
    increases reactivity and deepens cutoff.
  Content_Angle: >-
    Why trying to force reconnection may deepen the cutoff.
  Content_Angle_Example: >-
    Opening it might sound like: "The instinct when a family relationship goes
    quiet is to close the distance — more contact, a longer message, one more
    attempt to be understood. That instinct is what usually widens the gap,
    because the pursuit is carrying the anxiety rather than resolving it."
    Then show what steady, lower-intensity contact looks like instead.

- Pattern_Name: The Resource Trap
  Triggers:
    - free
    - low cost
    - sliding scale
    - cheap
    - affordable
    - covered
    - insurance
  Status_Quo_Message: >-
    High anxiety about resources/access. Seeking immediate symptom relief (venting).
  Bowen_Bridge_Reframe: >-
    Address the anxiety driving the search. Cheap relief often delays real
    structural change.
  Content_Angle: >-
    When short-term relief becomes a substitute for working the family pattern.
  Content_Angle_Example: >-
    Answer the cost question honestly and early — people searching "{question}"
    will not read past a page that dodges it. Then: "The more useful question is
    what you are buying. Relief that gets you through the week is worth having,
    and it is a different purchase from changing a pattern that has been running
    for three generations. Confusing the two is what makes counselling feel
    expensive and ineffective at the same time."

- Pattern_Name: The Blame/Reactivity Trap
  Relevant_Intent_Class: External Locus
  Triggers:
    - narcissist
    - toxic
    - abusive
    - mean
    - angry
    - hate
    - deal with
  Status_Quo_Message: >-
    The problem is the other person (The Identified Patient).
  Bowen_Bridge_Reframe: >-
    Focus on self-regulation. You cannot change them, only your response to them.
  Content_Angle: >-
    Stop diagnosing the other person and start observing your own reactivity.
  Content_Angle_Example: >-
    Opening it might sound like: "Most people arrive with a diagnosis already
    made, and it is about somebody else. That diagnosis may even be accurate. It
    is still the least useful place to start, because it puts the one thing you
    can actually change — your own part in the exchange — outside the frame."
    Then walk through noticing one reaction, in one recurring conversation.
