# serp_vocab.yml — editorial vocabulary for the SERP audit pipeline.
#
# Spec: seo_geo_review_20260704.md C.4 (externalise hardcoded editorial
# vocab from serp_audit.py / pattern_matching.py per the CLAUDE.md rule
# that trigger lists and vocabularies live in config files, not Python).
#
# EDITORIAL FILE — a non-developer may edit any list here.
# Values below are the exact lists previously hardcoded in Python.
#
# Precedence note: if the out-of-repo shared_config.json defines
# "stop_words", that still overrides the stop_words list here (single
# source of truth for cross-tool settings). Everything else is owned by
# this file.

# Words excluded from the n-gram corpus before Bowen pattern matching.
# Includes geographic and clinical filler so location/topic words don't
# dominate the bigram/trigram counts.
stop_words:
  - the
  - and
  - to
  - of
  - a
  - in
  - is
  - for
  - "on"    # quoted — bare `on` is YAML 1.1 boolean true
  - with
  - as
  - at
  - by
  - an
  - be
  - or
  - are
  - from
  - that
  - this
  - it
  - we
  - our
  - us
  - can
  - will
  - your
  - you
  - my
  - me
  - not
  - have
  - has
  - but
  - so
  - if
  - their
  - they
  - vancouver
  - bc
  - british
  - columbia
  - canada
  - north
  - west
  - counselling
  - counseling
  - therapy
  - therapist
  - counsellor
  - counselor
  - service
  - services
  - clinic
  - centre
  - center
  - help
  - support
  - highlytrained

# PAA question categorisation triggers ("Bridge Strategy"). A question
# containing any trigger (substring match, lowercased) gets that category
# and a score of 10; first matching category wins, in this order.
paa_category_triggers:
  Commercial:
    - cost
    - price
    - how much
    - fees
  Distress:
    - survive
    - divorce
    - infidelity
    - leave
    - separation
  Reactivity:
    - narcissist
    - toxic
    - signs
    - mean
    - angry
    - cut off
    - hate

# Tokens that mark a keyword as service-like when generating AI-likely
# query alternatives (substring match on the de-localised keyword).
service_like_tokens:
  - counselling
  - counseling
  - counsellor
  - counselor
  - therapist
  - therapy
  - psychologist
  - mental health

# E-E-A-T author-signal vocabulary (Spec: seo_geo_deferred_spec_v1.md#G.3).
# Therapy is YMYL content: visible author credentials on ranking pages are
# a signal both Google and AI answer engines weight.
# - credential_tokens: professional designations that mark a byline as
#   credentialed. Single tokens match on whole-word boundaries,
#   case-insensitive ("RP" never fires inside "harp"); multi-word phrases
#   match as substrings — same approach as intent_classifier_triggers.yml.
# - review_markers: phrases indicating clinical/medical review of the page.
eeat_signals:
  credential_tokens:
    - RCC
    - CCC
    - MSW
    - RSW
    - PhD
    - PsyD
    - RP
    - RCT
    - registered clinical counsellor
    - registered psychologist
    - registered social worker
    - registered psychotherapist
    - marriage and family therapist
    - canadian certified counsellor
  review_markers:
    - medically reviewed
    - clinically reviewed
    - reviewed by

# Situational (conversational) probe templates (Spec:
# seo_geo_deferred_spec_v1.md#T.5, restructured yoast_geo_upgrade_spec_v1.md#Y.4).
# Fallback source for the "S"-label query probes: a keyword's own 6+-word PAA
# questions are used first (verbatim); these templates fill the remaining
# probes_per_keyword slots.
#
# PERSONA-KEYED (Y.4): a MAP of persona_label -> [templates...]. When a client
# profile (Y.1) is present, only that profile's declared personas are expanded;
# with NO profile, ALL persona blocks are expanded (backward-compatible — the
# old flat list is preserved verbatim under `therapy_seeker`, so keyword-only
# runs produce the same superset of probes as before).
#
# Placeholders: {base} = de-localised keyword, {topic} = the subject after
# "help with " (otherwise same as {base}), {city} = configured SERP city, and
# the optional {service} = the client profile's service_description (omitted
# cleanly when absent). Keep every template 6+ words — the probes exist to
# measure how often long, situation-style queries trigger an AI answer versus
# short keywords.
situational_templates:
  therapy_seeker:
    - "my partner refuses to try {base} what can I do"
    - "how do I know if we actually need {base} or if it is too late"
    - "what should I expect from a first {base} session in {city}"
    - "I feel stuck dealing with {topic} on my own where do I start"
    - "my family keeps having the same fight over and over will {base} help"
  clinician_trainee:
    - "how do I get trained in {base} as a clinician"
    - "what supervision is available for {base} practitioners in {city}"
    - "is {base} training worth it for a working therapist"
  referrer:
    - "where can I refer a family for {base} in {city}"
    - "how do I refer a patient for {base} near me"
    - "which local providers offer {base} for a GP referral in {city}"

# Templates for the two AI-likely informational alternatives generated per
# keyword. Placeholders: {base} = de-localised keyword, {topic} = the
# subject after "help with ", {city} = configured SERP city.
ai_alternative_templates:
  service:
    - "how to choose the right {base}?"
    - "how much does {base} cost in {city}?"
  help_with:
    - "what are effective ways to manage {topic}?"
    - "where to get help for {topic} in {city}?"
  default:
    - "what are the best options for {base}?"
    - "how much does {base} cost in {city}?"

# display_stop_words — generic English function words ONLY.
#
# Spec: report_content_direction_spec.md#CD.3 (added by the CD.11 fix)
#
# WHY THIS IS SEPARATE FROM stop_words
# ------------------------------------
# `stop_words` above is a DOMAIN NOISE list: it deliberately contains the
# market's own nouns — counselling, therapy, clinic, vancouver, bc, service —
# so that get_ngrams() strips them and the Bowen trigger words stand out in a
# denser haystack. That is exactly right for trigger matching.
#
# It is exactly WRONG for deciding where a human-readable phrase may begin and
# end. get_display_ngrams() drops a span that starts or ends on a stop word, so
# reusing the list above made the report's "words competitors use" section
# structurally incapable of ever showing `family counselling`, `couples
# therapy`, or `north vancouver` — the very vocabulary the section exists to
# surface. It also truncated "Couple & Family Therapy" into `couple family`.
#
# So: keep this list to words that carry no topic meaning in ANY market —
# articles, prepositions, conjunctions, auxiliaries, pronouns, possessives.
#
# Do NOT add question words (how, what, why, when, where, which, who). A phrase
# may legitimately start with one ("how therapy works"), and listing them here
# would delete that whole class.
#
# Do NOT add topic nouns here. If a word describes the subject matter, it
# belongs in stop_words above, not in this list.
display_stop_words:
  - a
  - an
  - and
  - any
  - are
  - as
  - at
  - be
  - been
  - being
  - both
  - but
  - by
  - did
  - do
  - does
  - each
  - for
  - from
  - had
  - has
  - have
  - he
