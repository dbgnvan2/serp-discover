# serp_vocab.yml — editorial vocabulary for the SERP audit pipeline.
#
# Spec: seo_geo_review_20260704.md C.4 (externalise hardcoded editorial
# vocab from serp_audit.py / pattern_matching.py per the CLAUDE.md rule
# that trigger lists and vocabularies live in config files, not Python).
#
# EDITORIAL FILE — a non-developer may edit any list here.
# Values below are the exact lists previously hardcoded in Python.
#
# Precedence note: if the out-of-repo shared_config.json defines
# "stop_words", that still overrides the stop_words list here (single
# source of truth for cross-tool settings). Everything else is owned by
# this file.

# Words excluded from the n-gram corpus before Bowen pattern matching.
# Includes geographic and clinical filler so location/topic words don't
# dominate the bigram/trigram counts.
stop_words:
  - the
  - and
  - to
  - of
  - a
  - in
  - is
  - for
  - "on"    # quoted — bare `on` is YAML 1.1 boolean true
  - with
  - as
  - at
  - by
  - an
  - be
  - or
  - are
  - from
  - that
  - this
  - it
  - we
  - our
  - us
  - can
  - will
  - your
  - you
  - my
  - me
  - not
  - have
  - has
  - but
  - so
  - if
  - their
  - they
  - vancouver
  - bc
  - british
  - columbia
  - canada
  - north
  - west
  - counselling
  - counseling
  - therapy
  - therapist
  - counsellor
  - counselor
  - service
  - services
  - clinic
  - centre
  - center
  - help
  - support
  - highlytrained

# PAA question categorisation triggers ("Bridge Strategy"). A question
# containing any trigger (substring match, lowercased) gets that category
# and a score of 10; first matching category wins, in this order.
paa_category_triggers:
  Commercial:
    - cost
    - price
    - how much
    - fees
  Distress:
    - survive
    - divorce
    - infidelity
    - leave
    - separation
  Reactivity:
    - narcissist
    - toxic
    - signs
    - mean
    - angry
    - cut off
    - hate

# Tokens that mark a keyword as service-like when generating AI-likely
# query alternatives (substring match on the de-localised keyword).
service_like_tokens:
  - counselling
  - counseling
  - counsellor
  - counselor
  - therapist
  - therapy
  - psychologist
  - mental health

# E-E-A-T author-signal vocabulary (Spec: seo_geo_deferred_spec_v1.md#G.3).
# Therapy is YMYL content: visible author credentials on ranking pages are
# a signal both Google and AI answer engines weight.
# - credential_tokens: professional designations that mark a byline as
#   credentialed. Single tokens match on whole-word boundaries,
#   case-insensitive ("RP" never fires inside "harp"); multi-word phrases
#   match as substrings — same approach as intent_classifier_triggers.yml.
# - review_markers: phrases indicating clinical/medical review of the page.
eeat_signals:
  credential_tokens:
    - RCC
    - CCC
    - MSW
    - RSW
    - PhD
    - PsyD
    - RP
    - RCT
    - registered clinical counsellor
    - registered psychologist
    - registered social worker
    - registered psychotherapist
    - marriage and family therapist
    - canadian certified counsellor
  review_markers:
    - medically reviewed
    - clinically reviewed
    - reviewed by

# Situational (conversational) probe templates (Spec:
# seo_geo_deferred_spec_v1.md#T.5, restructured yoast_geo_upgrade_spec_v1.md#Y.4).
# Fallback source for the "S"-label query probes: a keyword's own 6+-word PAA
# questions are used first (verbatim); these templates fill the remaining
# probes_per_keyword slots.
#
# PERSONA-KEYED (Y.4): a MAP of persona_label -> [templates...]. When a client
# profile (Y.1) is present, only that profile's declared personas are expanded;
# with NO profile, ALL persona blocks are expanded (backward-compatible — the
# old flat list is preserved verbatim under `therapy_seeker`, so keyword-only
# runs produce the same superset of probes as before).
#
# Placeholders: {base} = de-localised keyword, {topic} = the subject after
# "help with " (otherwise same as {base}), {city} = configured SERP city, and
# the optional {service} = the client profile's service_description (omitted
# cleanly when absent). Keep every template 6+ words — the probes exist to
# measure how often long, situation-style queries trigger an AI answer versus
# short keywords.
situational_templates:
  therapy_seeker:
    - "my partner refuses to try {base} what can I do"
    - "how do I know if we actually need {base} or if it is too late"
    - "what should I expect from a first {base} session in {city}"
    - "I feel stuck dealing with {topic} on my own where do I start"
    - "my family keeps having the same fight over and over will {base} help"
  clinician_trainee:
    - "how do I get trained in {base} as a clinician"
    - "what supervision is available for {base} practitioners in {city}"
    - "is {base} training worth it for a working therapist"
  referrer:
    - "where can I refer a family for {base} in {city}"
    - "how do I refer a patient for {base} near me"
    - "which local providers offer {base} for a GP referral in {city}"

# Templates for the two AI-likely informational alternatives generated per
# keyword. Placeholders: {base} = de-localised keyword, {topic} = the
# subject after "help with ", {city} = configured SERP city.
ai_alternative_templates:
  service:
    - "how to choose the right {base}?"
    - "how much does {base} cost in {city}?"
  help_with:
    - "what are effective ways to manage {topic}?"
    - "where to get help for {topic} in {city}?"
  default:
    - "what are the best options for {base}?"
    - "how much does {base} cost in {city}?"

# display_stop_words — generic English function words ONLY.
#
# Spec: report_content_direction_spec.md#CD.3 (added by the CD.11 fix)
#
# WHY THIS IS SEPARATE FROM stop_words
# ------------------------------------
# `stop_words` above is a DOMAIN NOISE list: it deliberately contains the
# market's own nouns — counselling, therapy, clinic, vancouver, bc, service —
# so that get_ngrams() strips them and the Bowen trigger words stand out in a
# denser haystack. That is exactly right for trigger matching.
#
# It is exactly WRONG for deciding where a human-readable phrase may begin and
# end. get_display_ngrams() drops a span that starts or ends on a stop word, so
# reusing the list above made the report's "words competitors use" section
# structurally incapable of ever showing `family counselling`, `couples
# therapy`, or `north vancouver` — the very vocabulary the section exists to
# surface. It also truncated "Couple & Family Therapy" into `couple family`.
#
# So: keep this list to words that carry no topic meaning in ANY market —
# articles, prepositions, conjunctions, auxiliaries, pronouns, possessives.
#
# Do NOT add question words (how, what, why, when, where, which, who). A phrase
# may legitimately start with one ("how therapy works"), and listing them here
# would delete that whole class.
#
# Do NOT add topic nouns here. If a word describes the subject matter, it
# belongs in stop_words above, not in this list.
display_stop_words:
  - a
  - an
  - and
  - any
  - are
  - as
  - at
  - be
  - been
  - being
  - both
  - but
  - by
  - did
  - do
  - does
  - each
  - for
  - from
  - had
  - has
  - have
  - he
  - her
  - hers
  - him
  - his
  - i
  - if
  - in
  - into
  - is
  - it
  - its
  - me
  - my
  - nor
  - not
  - of
  - "on"    # quoted — bare `on` is YAML 1.1 boolean
  - or
  - our
  - ours
  - per
  - she
  - so
  - some
  - such
  - than
  - that
  - the
  - their
  - theirs
  - them
  - then
  - there
  - these
  - they
  - this
  - those
  - to
  - us
  - via
  - was
  - we
  - were
  - will
  - with
  - would
  - you
  - your
  - yours

# ---------------------------------------------------------------------------
# Fetch outcomes for the organic-row enrichment pass (review chunk D2c,
# finding D-C-20). `Fetch_Status` carries one of these words on every organic
# row, so a reader can tell "this page has no author byline" from "we never
# read this page". The ONLY home for these words — a second copy in Python is
# how one state came to carry two labels in different outputs (the D2a/D2b
# lesson).
fetch_status:
  enriched: "Enriched"
  blocked: "Blocked ({status})"
  # No request could be made at all: an unparseable URL or a redirect
  # loop. Retrying cannot change the answer.
  unreachable: "Unreachable"
  # Every attempt failed at the network layer after the retries — a
  # timeout, a reset, a host that did not resolve. This page may be
  # readable on the next run, which "Unreachable" denied (review chunk Y2).
  fetch_retryable: "Not Read (network, retry)"
  not_attempted: "Not Fetched"
  not_destination_page: "Not The Ranked Page"
  blocked_warning: >-
    {blocked} of {attempted} pages were not read (an error status, a network
    failure after the retries, or no request possible at all — the rows' own
    Fetch_Status says which); their page-level figures read Not Measured
    rather than zero
  no_url: "No URL"
  enrichment_disabled: "Enrichment Off"
  # The same states as a PHRASE rather than a cell label, for the sentences
  # that say why a page was not read ("4 because the link resolved to the site
  # root"). These were a Python dict in `brief_data_extraction.py`
  # (`_UNREAD_FETCH_STATES`) — a second home for the words above, which is
  # what this file exists to prevent; moved here 2026-11-19. A state missing
  # from here falls back to its cell label.
  reasons:
    blocked: "the site returned an error status"
    fetch_retryable: "every attempt failed at the network layer"
    unreachable: "the page could not be reached"
    not_attempted: "the per-run page budget stopped before this rank"
    not_destination_page: "the link resolved to the site root, not the ranked page"
    no_url: "the row carried no URL"
    enrichment_disabled: "page enrichment was switched off for this run"

# Why the SERP-intent column reads as it does, said once at the top of the
# report instead of ten times as "0 of 10 classified" with no cause (added
# 2026-11-19 from the first live run: 125 of 221 ranked results came back as a
# Google redirect that recovered only to a site root, 58 were never fetched,
# so every one of ten keywords had no intent verdict and the report
# recommended no page for any of them — with nothing anywhere saying why).
# `{reasons}` is built from the rows' own Fetch_Status labels above, so the
# cause named here is the one each row recorded, never a guess.
classification_coverage:
  line: >-
    **Ranked results classified:** {classified} of {total}. SERP intent is read
    from classified results only, so a keyword with few of them gets no intent
    verdict and no page recommendation. The figure is the top-10 window each
    keyword's verdict is read from, the same one the per-keyword sections
    report. The rest were not classified because {reasons}.
  reason_item: "{count} × {label}"
  # A page that WAS read and still has no intent: its content type is one the
  # intent table sends to `uncategorised` ("other", "unknown"). Without this
  # the causes added up to less than the deficit they explain.
  unmapped_type: "their page type does not map to a search intent"
  none_classified: >-
    **Ranked results classified:** none of {total}. No keyword can have a SERP
    intent verdict this run, which is why the table below recommends no page:
    {reasons}. Re-run once the pages can be read.

# Review chunk Y13 — the words for a cleanup step that failed. A failing
# `rollback()` or `close()` does not make the run's data wrong (chunk Y11 made
# sure of that), so this is reported, never raised; but a `close()` that keeps
# failing leaks a file descriptor each time, and the operator who has to act
# on that reads the workbook, not stderr. `{failures}` is the total, `{detail}`
# a "N x close" / "N x roll back" breakdown.
db_cleanup:
  warning: >-
    {failures} database cleanup step(s) failed during this run ({detail}).
    {consequence} A cleanup that keeps failing usually means the database file
    or its directory has become unwritable, and each failed close holds a file
    handle open until the process exits
  # Which consequence the sentence may claim. A failed close comes after the
  # commit, so the writes are durable; a failed rollback means a block raised
  # and its transaction was abandoned, which is not "the figures stand".
  consequence_committed: >-
    The run's own writes were committed and its figures stand.
  consequence_rolled_back: >-
    At least one of them was a failed rollback, which means a block raised and
    abandoned its transaction: what that step was writing is incomplete, and
    the earlier steps' committed figures stand.
  detail_item: "{count} x {what}"
  # Printed only when more than one database is involved, because the
  # operator's next action is to check a file.
  paths: ". The database(s) involved: {paths}"
  # A workbook cannot be amended once written, and the run keeps writing to
  # the database after it.
  after_output: >-
    {further} further database cleanup step(s) failed after this run's output
    was written, so the row in it counts only the {counted} that came before
