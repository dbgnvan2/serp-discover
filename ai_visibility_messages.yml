# ai_visibility_messages.yml — the words a reader sees when an AI engine was
# not measured.
#
# Spec: D3a (docs/review_2026-11-04/PLAN_D3_ai_visibility_honesty.md),
#       findings D-C-05 / D-C-11 / D-M-03; cold-review finding F4.
#
# Why this file exists: "we have no measurement for this engine" is one state,
# and it was rendered four different ways across probe_ai_visibility.py,
# engine_transfer.py and engine_recommendations.py at first write. The same
# shape is already recorded twice in this repo — `feasibility_messages.yml`
# exists because four Python copies of a status map let one unmeasured state
# carry two labels, and `gsc_messages.yml` because "GSC answered nothing" and
# "the fetch never got there" shared one word. Editorial content belongs in
# config (CLAUDE.md), and one home stops these four wordings drifting apart.
#
# Status keys must match the constants in probe_ai_visibility.py:
#   answered       — the call returned text or sources: the verdict is real.
#   failed         — the call raised, or returned neither text nor sources.
#                    NOT a finding that the client was absent.
#   not_measured   — the engine produced no answer at all this run (skipped
#                    for a missing key, or every call failed). Carries no
#                    AIVI, no place in any average, no rank.
#   not_comparable — two engines cited nothing, so their overlap is undefined.
#                    NOT a finding of zero overlap.
# A missing or malformed file degrades to the built-in wording; it never
# aborts a report.

statuses:
  answered:
    label: "answered"
    cell: "—"
    coverage: "the engine returned an answer"
  failed:
    label: "failed"
    cell: "failed"
    coverage: "the call returned no answer"
  not_measured:
    label: "not measured"
    cell: "not measured"
    coverage: "the engine returned no answer this run"
  not_comparable:
    label: "not measurable"
    cell: "not measurable"
    coverage: "neither side cited a source, so there is nothing to compare"

# Lines the report prints. `{...}` placeholders are filled by the renderers;
# an unknown placeholder falls back to the built-in wording rather than
# raising.
lines:
  # Why one engine carries no measurement. `reason_*` are the short forms
  # stored on each `engines_unmeasured` entry.
  reason_skipped: "skipped — {reason}"
  reason_all_failed: >-
    0 of {attempted} calls returned an answer ({failed} failed)
  reason_no_questions: "no questions were asked"
  reason_no_aivi: "no AIVI — the engine was not measured"
  reason_no_profile: "no engine profile in engine_profiles.yml"

  # Per-engine summary table (one note line under the table).
  engine_note: "*{engine}: {reason}*"
  engine_not_measured: "not measured — {reason}"

  # AIVI headline: the mean states the engines it is over (P2).
  aivi_average: >-
    **All-engine average AIVI: {average}/100** — over {measured} of {enabled}
    enabled engine(s)
  aivi_not_measured: >-
    *Not measured this run, so carrying no AIVI and no place in the average
    above: {engines}. An engine that was not asked, or whose every call
    failed, is not a zero.*

  # Leaderboard / citations: an engine that answered nothing cannot be a
  # finding that no brand was named or no source cited (P1/P6).
  leaderboard_not_measured: >-
    *Not measured — {reason}. No answers were returned this run, so no brand
    could be named in them. This is not a finding that the AI named nobody.*
  citations_not_measured: >-
    *Not measured — {reason}. No answers were returned this run, so no source
    could be cited in them. This is not a finding that the AI cited nothing.*

  # Platform prioritisation.
  prioritization_not_measured_heading: "**Not ranked — not measured.**"
  prioritization_not_measured_note: >-
    An unmeasured engine is not a high-opportunity engine. Re-run once it can
    be reached before reading anything into its absence.

  # Cross-engine transfer. A transient failure is not a configuration state
  # (P1): "only one engine is enabled" and "only one engine answered" call for
  # different actions.
  transfer_single_enabled: >-
    *Transfer not measurable — only one engine is enabled. Enable at least two
    engines to measure how much this client's AI visibility overlaps across
    them.*
  transfer_single_measured: >-
    *Transfer not measurable this run — only {measured} of {enabled} enabled
    engines returned an answer ({unmeasured}). This is a gap in the run, not a
    finding about the client: re-run before reading the overlap.*
  transfer_reason_single_enabled: "transfer not measurable (single engine enabled)"
  transfer_reason_single_measured: >-
    transfer not measurable ({measured} of {enabled} enabled engines returned
    an answer)
  jaccard_pair_not_comparable: "not measurable (neither engine cited a source)"
  jaccard_avg_not_comparable: "not measurable (no engine pair had a cited source)"

  # ---------------------------------------------------------------------
  # Sentiment (answer_sentiment.py). Cold-review finding 4: an exhausted
  # call budget is neither a failure nor an absence of mentions — the
  # answers did portray the brand and nothing was asked about them.
  # ---------------------------------------------------------------------
  sentiment_budget_exhausted: >-
    not measured — the sentiment call budget ran out before any of the
    {skipped} answer(s) naming this brand could be classified. Nothing is
    known about how they portray it: re-run with a larger
    `max_total_calls`.
  sentiment_all_failed: >-
    not measured — all {attempted} classification(s) failed, so this brand
    has no sentiment this run. Not a neutral portrayal: re-run.
  sentiment_not_portrayed: >-
    not measured — no answer this run portrayed this brand.
  sentiment_skipped_note: >-
    ; {skipped} further answer(s) were never classified (call budget spent)

  # ---------------------------------------------------------------------
  # Foundational readiness (foundational_score.py). Cold-review finding 6:
  # "no schema recommendations are configured" and "the client has no page
  # in any enriched top-10" are two different facts and both printed a
  # bare n/a, so the client least visible in the SERPs was the one whose
  # report carried no structure advice at all.
  # ---------------------------------------------------------------------
  foundational_structure_no_client_page: >-
    the client has no enriched page in any keyword's top-10 this run, so
    its own markup was never fetched — the recommendations below still
    stand, nothing was measured against them
  foundational_structure_no_recs: >-
    no schema contexts are configured in schema_recommendations.yml, so
    there is nothing to measure the client's markup against
  foundational_subscore_reason: "*{label}: {reason}.*"
  foundational_delta_definition_changed: >-
    n/a — the structure sub-score changed definition since the prior run
    (it now reads the client's own page, not the enriched top-10), so the
    two scores are not comparable
